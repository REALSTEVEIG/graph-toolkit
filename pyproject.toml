[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphkit"
version = "0.1.0"
description = "A small, readable graph-algorithms toolkit in pure Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Stephen Ignatius" }]
license = "MIT"
keywords = ["graph", "algorithms", "dijkstra", "shortest-path", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
graphkit = "graphkit.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
