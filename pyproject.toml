[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphkit"
version = "0.1.0"
description = "A small, readable graph-algorithms toolkit in pure Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Stephen Ignatius" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
